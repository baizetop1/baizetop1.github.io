# Site settings
title: BZ 现场笔记
SEOTitle: BZ 现场笔记 | 安全、系统、工具与生活记录
header-img: img/post-bg-shyplay.jpg
email: baizetop@gmail.com
description: "记录安全、系统、工具、项目与生活里的真实问题，把经验整理成下一次可复用的路径。"
keyword: "网络安全, 系统排障, Linux, Windows, Docker, Shell, Git, 个人知识库, BZ"
url: "https://baizeone.top"          # your host, for absolute URL
baseurl: ""      # for example, '/blog' if your blog hosted on 'host/blog'
github_repo: "https://github.com/baizetop1/baizetop1.github.io" # your code repository
github_branch: master
lang: zh-CN
timezone: Asia/Shanghai

# Sidebar settings
sidebar: false                          # the new layout uses contextual sidebars only.
sidebar-about-description: "把踩过的坑，整理成下一次可复用的路径。"
sidebar-avatar:



# SNS settings
RSS: false
# weibo_username:     baize
# zhihu_username:     baize
github_username:    baizetop1
# facebook_username:  baize
# jianshu_username:   baize
#twitter_username:   baize




# Build settings
# from 2024, 'pygments' is unsupported on GitHub Pages. Use 'rouge' for highlighting instead.
permalink: pretty
paginate: 10
exclude: ["less","node_modules","Gruntfile.js","package.json","README.md","scripts","templates","docs","PUBLISHING.md"]
anchorjs: true                          # if you want to customize anchor. check out line:181 of `post.html`



# Gems
# from PR#40, to support local preview for Jekyll 3.0
plugins: [jekyll-paginate]

# 新文章只需填写标题、日期和正文；其余字段会使用这里的默认值。
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      author: 白泽
      catalog: true
      category: 随笔
      format: 笔记
      status: published
  - scope:
      path: ""
      type: drafts
    values:
      layout: post
      author: 白泽
      catalog: true
      category: 随笔
      format: 笔记
      status: draft




# Markdown settings
# replace redcarpet to kramdown,
# although redcarpet can auto highlight code, the lack of header-id make the catalog impossible, so I switch to kramdown
# document: http://jekyllrb.com/docs/configuration/#kramdown
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM                            # use Github Flavored Markdown !important



# 统计

# Analytics settings
# Baidu Analytics
# ba_track_id: b50bf2b12b5338a1845e33832976fd68

# Google Analytics
# ga_track_id: 'UA-90855596-1'            # Format: UA-xxxxxx-xx
ga_domain: baizeone.top               # 默认的是 auto, 这里我是自定义了的域名，你如果没有自己的域名，需要改成auto





# Featured Tags
featured-tags: true                     # 是否使用首页标签
featured-condition-size: 1              # 相同标签数量大于这个数，才会出现在首页



# Progressive Web Apps
chrome-tab-theme-color: "#000000"
service-worker: false



