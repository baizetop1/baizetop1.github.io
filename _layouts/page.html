---
layout: default
---
<section class="page-hero">
    <div class="container container--narrow">
        <p class="eyebrow">{{ page.kicker | default: 'Knowledge base' }}</p>
        <h1>{{ page.title | default: site.title }}</h1>
        {% if page.description %}<p class="page-hero__description">{{ page.description }}</p>{% endif %}
    </div>
</section>
<div class="container container--narrow page-content">
    <article class="prose">{{ content }}</article>
</div>
