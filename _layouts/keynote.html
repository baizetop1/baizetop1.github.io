---
layout: default
---
<article class="article-shell">
    <header class="article-header container container--narrow">
        <div class="article-header__topline"><a href="{{ '/' | relative_url }}">← 返回首页</a></div>
        <h1>{{ page.title }}</h1>
        {% if page.subtitle %}<p class="article-lede">{{ page.subtitle }}</p>{% endif %}
    </header>
    <div class="container container--narrow prose post-container">{{ content }}</div>
</article>
