<footer class="site-footer">
    <div class="site-footer__inner">
        <div>
            <p class="footer-title">BZ 安全手记</p>
            <p class="footer-note">把踩过的坑，整理成下一次可复用的路径。</p>
        </div>
        <div class="footer-links">
            <a href="{{ site.github_repo }}" target="_blank" rel="noreferrer">GitHub ↗</a>
            <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
            <span>© {{ site.time | date: '%Y' }} BZ</span>
        </div>
    </div>
</footer>

<div class="search-dialog" data-search-dialog hidden>
    <div class="search-dialog__backdrop" data-search-close></div>
    <section class="search-dialog__panel" role="dialog" aria-modal="true" aria-labelledby="search-title">
        <div class="search-dialog__topline">
            <h2 id="search-title">搜索知识库</h2>
            <button type="button" class="icon-button" data-search-close aria-label="关闭搜索">×</button>
        </div>
        <label class="search-input-wrap">
            <span aria-hidden="true">⌕</span>
            <input type="search" data-search-input placeholder="搜索文章、标签或命令…" autocomplete="off">
            <kbd>ESC</kbd>
        </label>
        <div class="search-results" data-search-results aria-live="polite"></div>
    </section>
</div>

<script id="search-index" type="application/json">
[
    {% for post in site.posts %}
    {
        "title": {{ post.title | jsonify }},
        "subtitle": {{ post.subtitle | default: '' | jsonify }},
        "url": {{ post.url | relative_url | jsonify }},
        "excerpt": {{ post.content | strip_html | truncate: 180 | jsonify }},
        "tags": {{ post.tags | default: empty | jsonify }},
        "category": {{ post.category | default: '知识' | jsonify }},
        "status": {{ post.status | default: 'review' | jsonify }}
    }{% unless forloop.last %},{% endunless %}
    {% endfor %}
]
</script>
<script src="{{ '/js/site.js' | relative_url }}" defer></script>
<script>
    // Remove the legacy cache layer from the old theme once, so stale pages cannot survive the redesign.
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (registrations) {
            return Promise.all(registrations.map(function (registration) { return registration.unregister(); }));
        }).then(function () {
            if ('caches' in window) return caches.keys().then(function (keys) { return Promise.all(keys.map(function (key) { return caches.delete(key); })); });
        }).catch(function () { /* cache cleanup is best effort */ });
    }
</script>
