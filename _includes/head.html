<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    {% assign meta_description = page.description | default: site.description %}
    <meta name="description" content="{{ meta_description | strip_html | escape }}">
    <meta name="keywords" content="{{ site.keyword | escape }}">
    <meta name="author" content="{{ site.title | escape }}">
    <meta name="theme-color" content="#f4f3ee" id="theme-color">
    <meta name="color-scheme" content="light dark">

    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.SEOTitle }}</title>
    <link rel="canonical" href="{{ page.url | replace:'index.html','' | absolute_url }}">
    <link rel="shortcut icon" href="{{ '/img/favicon.ico' | relative_url }}">
    <link rel="apple-touch-icon" href="{{ '/img/apple-touch-icon.png' | relative_url }}">
    <link rel="stylesheet" href="{{ '/css/site.css' | relative_url }}">
    <script>
        (function () {
            try {
                var stored = localStorage.getItem('bz-theme');
                var theme = stored || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
                document.documentElement.dataset.theme = theme;
                document.getElementById('theme-color').setAttribute('content', theme === 'dark' ? '#0b1118' : '#f4f3ee');
            } catch (error) {
                document.documentElement.dataset.theme = 'light';
            }
        }());
    </script>
    {% if page.layout == 'post' %}
    <meta property="og:type" content="article">
    <meta property="article:published_time" content="{{ page.date | date_to_xmlschema }}">
    {% else %}
    <meta property="og:type" content="website">
    {% endif %}
    <meta property="og:title" content="{% if page.title %}{{ page.title }} · {% endif %}{{ site.SEOTitle }}">
    <meta property="og:description" content="{{ meta_description | strip_html | escape }}">
    <meta property="og:url" content="{{ page.url | replace:'index.html','' | absolute_url }}">
    <meta property="og:site_name" content="{{ site.title }}">
    <meta property="og:locale" content="zh_CN">
    <meta name="twitter:card" content="summary">
    {% if page.layout == 'post' %}
    {% if page.category %}<meta property="article:section" content="{{ page.category | escape }}">{% endif %}
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "Article",
        "headline": {{ page.title | jsonify }},
        "description": {{ meta_description | strip_html | jsonify }},
        "datePublished": "{{ page.date | date_to_xmlschema }}",
        "dateModified": "{{ page.updated | default: page.date | date_to_xmlschema }}",
        "author": {"@type": "Person", "name": {{ page.author | default: '白泽' | jsonify }}},
        "mainEntityOfPage": {"@type": "WebPage", "@id": "{{ page.url | absolute_url }}"},
        "publisher": {"@type": "Person", "name": "白泽"}
    }
    </script>
    {% endif %}
</head>
